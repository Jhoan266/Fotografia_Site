name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SESSION_SECRET: ci-only-session-secret-please-replace-1234567890
      DATABASE_URL: postgresql://fotografia:fotografia@localhost:5432/fotografia?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: ./storage

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fotografia
          POSTGRES_PASSWORD: fotografia
          POSTGRES_DB: fotografia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fotografia -d fotografia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Security unit tests
        run: npx --no-install tsx --test tests/login-source.test.ts tests/upload-body.test.ts tests/zip-export.test.ts

      - name: Backup retention tests
        run: python3 tests/backup-retention-test.py -v

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build


  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Isolated PostgreSQL and S3 restore
        shell: pwsh
        run: ./tests/s3-bucket-restore.ps1
